<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Video Experience</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const arTarget = document.querySelector('#ar-target');
            const video = document.querySelector('#ar-video');

            // Cuando detecta el marcador
            arTarget.addEventListener('targetFound', () => {
                video.play().catch(e => console.error("Video play failed", e));
            });

            // Cuando pierde el marcador
            arTarget.addEventListener('targetLost', () => {
                video.pause();
            });

            // 🔊 ACTIVAR SONIDO AL TOCAR LA PANTALLA
            document.body.addEventListener('click', () => {
                video.muted = false;
                video.play();
            });
        });
    </script>

    <style>
        /* Mensaje simple para el usuario */
        #mensaje {
            position: fixed;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 18px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            z-index: 999;
        }
    </style>
</head>

<body>

<div id="mensaje">
👉 Toca la pantalla para activar el sonido
</div>

<a-scene 
    mindar-image="imageTargetSrc: ./marker.mind;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false" 
    renderer="colorManagement: true;"
>
    
    <a-assets>
        <video 
            id="ar-video" 
            src="./asset.mp4" 
            loop 
            playsinline 
            crossorigin="anonymous">
        </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
        <a-plane
            src="#ar-video"
            position="0 0 0"
            rotation="0 0 0"
            height="1"
            width="1.7777777777777777">
        </a-plane>
    </a-entity>

</a-scene>

</body>
</html>
